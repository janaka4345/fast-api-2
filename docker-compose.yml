services:
  governa-ai-api:
    restart: always
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - ollama-network
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ollama-network
    command: run llama3.2

volumes:
  ollama_data:

networks:
  ollama-network:
    driver: bridge



